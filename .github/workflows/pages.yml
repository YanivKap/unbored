name: deploy to pages

# Runs on every push to main — including the nightly commit from daily.yml,
# so a new deck goes live automatically.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages looks the uploaded artifact up through the Actions API.
  # Declaring any permissions zeroes out the rest, so without this it silently
  # finds 0 artifacts instead of getting a 403.
  actions: read

# Never cancel a deploy midway, but only keep one queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
