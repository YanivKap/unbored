name: daily deck

on:
  schedule:
    # 03:00 UTC = 05:00 Israel (winter) / 06:00 (summer). Before you wake up.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a rebuild by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-deck
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch today's items
        run: node scripts/fetch.ts

      - name: Compose the deck
        run: node scripts/build.ts

      - name: Commit the new deck
        run: |
          git config user.name  "unbored bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json state/seen.json
          if git diff --staged --quiet; then
            echo "deck unchanged, nothing to commit"
          else
            git commit -m "deck: $(date -u +%Y-%m-%d)"
            git push
          fi
