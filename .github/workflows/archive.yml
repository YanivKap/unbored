name: top up archive

# The archive is timeless content, so it only needs refreshing occasionally.
on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Top up the archive
        run: node scripts/archive.ts 6000

      - name: Commit the archive
        run: |
          git config user.name  "unbored bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/archive.json
          if git diff --staged --quiet; then
            echo "archive unchanged"
          else
            git commit -m "archive: top up"
            git pull --rebase --autostash
            git push
          fi
